name: Check and publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check out the Bake core for local development
        run: |
          git clone --depth 1 https://github.com/socketry/bake-rust.git ../bake-rust
          git clone --depth 1 https://github.com/socketry/bake-releases-rust.git ../bake-releases-rust
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --locked

  publish:
    needs: check
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io
    concurrency: publish-${{ github.ref }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check out the Bake core for local development
        run: git clone --depth 1 https://github.com/socketry/bake-rust.git ../bake-rust
      - name: Validate version from release tag
        run: |
          cargo metadata --format-version 1 --no-deps --locked > "$RUNNER_TEMP/metadata.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          if not tag.startswith("v"):
              raise SystemExit(f"Unsupported release tag: {tag}")
          version = tag[1:]
          metadata = json.loads((Path(os.environ["RUNNER_TEMP"]) / "metadata.json").read_text())
          if len(metadata["packages"]) != 1 or metadata["packages"][0]["version"] != version:
              actual = [item["version"] for item in metadata["packages"]]
              raise SystemExit(f"Tag version {version} does not match package version {actual}")
          PY
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish package
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --workspace --locked
