[package]
name = "bake-releases-cargo"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/socketry/bake-releases-cargo-rust"
description = "Cargo and GitHub release automation tasks for Bake"
readme = "readme.md"
include = [
    "src/**",
    "context/**",
    "Cargo.toml",
    "readme.md",
    "license.md",
    "releases.md",
]

[workspace]
members = ["bake"]
resolver = "3"

[workspace.metadata.bake]
manifest = "bake/Cargo.toml"

[workspace.metadata.bake.release]
reviewers = ["socketry/managers"]

[lib]
name = "bake_releases_cargo"

[dependencies]
bake = ">=0.18.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.12", features = ["json"] }
tempfile = "3.27"
toml_edit = "0.25"
